
name: GTA VI Hourly Live Data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta-vi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare snapshot directory
        run: mkdir -p GTA_VI_Tracker/data/snapshots

      - name: Collect source activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 GTA_VI_Tracker/collector/collect.py

      - name: Validate collected JSON before publishing
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('GTA_VI_Tracker/data/live.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] in ('partial_collection','collection_failed')
          assert data.get('last_attempt_utc')
          assert len(data['source_results']) == 21, 'Expected 21 source health records'
          assert data['validation']['source_count_matches_expected']
          assert data['validation']['all_source_records_timestamped']
          assert data['validation']['all_events_have_source_urls']
          assert data['substantively_reviewed_sources'] == 0
          print('Validated collection:', data['status'], data['last_attempt_utc'], 'reachable', data['reachable_sources'])
          PY

      - name: Save live data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GTA_VI_Tracker/data/ GTA_VI_Tracker/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update GTA VI live research data"
            for attempt in 1 2 3; do\n              git push && break\n              if [ "$attempt" -eq 3 ]; then exit 1; fi\n              git pull --rebase origin main\n              sleep 3\n            done
          fi
