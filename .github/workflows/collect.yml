
name: GTA VI Hourly Live Data

on:
  push:
    paths:
      - '.github/workflows/collect.yml'
      - 'GTA_VI_Tracker/collector/independent.py'
      - 'GTA_VI_Tracker/collector/collect.py'
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta-vi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare snapshot directory
        run: mkdir -p GTA_VI_Tracker/data/snapshots

      - name: Collect source activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: GtaViSignalTracker/1.0 (public research; github.com/wrathlock/gta-vi-signal-tracker)
        run: python3 GTA_VI_Tracker/collector/collect.py

      - name: Validate collected JSON before publishing
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('GTA_VI_Tracker/data/live.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] in ('partial_collection','collection_failed')
          assert data.get('last_attempt_utc')
          assert len(data['source_results']) == 22, 'Expected 22 source health records'
          assert data['validation']['source_count_matches_expected']
          assert data['validation']['all_source_records_timestamped']
          assert data['validation']['all_events_have_source_urls']
          assert data['substantively_reviewed_sources'] == 0
          assert data['validation']['screening_count_matches_records']
          assert data['automated_content_screened_sources'] == sum(r.get('content_screening', {}).get('status') == 'screened' for r in data['source_results'])
          independent=json.loads(pathlib.Path('GTA_VI_Tracker/data/independent.json').read_text(encoding='utf-8'))
          assert isinstance(independent['findings'], list)
          assert independent['counts']['verified_gta_vi_tests'] == 0
          print('Validated collection:', data['status'], data['last_attempt_utc'], 'reachable', data['reachable_sources'])
          PY

      - name: Save live data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GTA_VI_Tracker/data/ GTA_VI_Tracker/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update GTA VI live research data"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Published live research data"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push live research data" >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
          else
            echo "No collected data changes to publish"
          fi
