
name: Deploy GTA VI Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'GTA_VI_Tracker/**'
      - '!GTA_VI_Tracker/collector/**'
      - '!GTA_VI_Tracker/data/snapshots/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["GTA VI Hourly Live Data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: GTA_VI_Tracker

      - name: Wait for Pages artifact registration
        run: sleep 20

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
